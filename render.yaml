services:
  - type: web
    name: examroutine-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python -m playwright install chromium
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: REFRESH_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
