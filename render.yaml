services:
  - type: web
    name: examroutine-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: REFRESH_SECRET
        generateValue: true
      - key: FIREBASE_DB_URL
        value: https://examroutine-d5392-default-rtdb.firebaseio.com
      - key: PYTHON_VERSION
        value: "3.12"
