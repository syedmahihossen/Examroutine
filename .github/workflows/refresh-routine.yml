name: Auto-refresh Render Backend

on:
  schedule:
    # Runs every 12 minutes to prevent Render from sleeping
    - cron: '*/12 * * * *'
  
  # Allows you to trigger this manually from the Actions tab
  workflow_dispatch: 

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and Warm Render Cache
        run: |
          curl -sS "${{ secrets.BACKEND_URL }}/api/refresh?exam_type=final&semester=summer&year=2026&secret=${{ secrets.REFRESH_SECRET }}"
          
          curl -sS "${{ secrets.BACKEND_URL }}/api/auto-analyze?section=65_L&exam_type=final&semester=summer&year=2026&include_seat_plan=true"
