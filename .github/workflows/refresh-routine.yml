name: Auto-refresh Render Backend

on:
  schedule:
    # Runs every 12 minutes to prevent Render from sleeping
    - cron: '*/12 * * * *'
  
  # Allows you to trigger this manually from the Actions tab
  workflow_dispatch: 

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Autonomous Engine
        run: |
          curl -sS "${{ secrets.BACKEND_URL }}/api/refresh?secret=${{ secrets.REFRESH_SECRET }}"
